# Render Blueprint for Deviant Backend
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: deviant-backend
    runtime: docker
    dockerfilePath: ./Dockerfile.prod
    region: oregon
    plan: standard  # Need more memory for ChromaDB + AI agents
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: deviant-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: deviant-redis
          type: redis
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: RAG_ENABLED
        value: "false"  # Disable RAG to reduce memory; enable when on larger plan
      - key: CHROMADB_PATH
        value: /app/data/chromadb

  - type: redis
    name: deviant-redis
    region: oregon
    plan: starter
    maxmemoryPolicy: allkeys-lru

databases:
  - name: deviant-db
    region: oregon
    plan: starter
    databaseName: deviant
    user: deviant
